<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VocApp</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top-banner">
    <nav class="nav-links">
      <a href="{{ url_for('login') }}">Login</a>
      <span>/</span>
      <a href="{{ url_for('quiz') }}">Breadcrumb Quiz</a>
      <span>/</span>
      <a href="{{ url_for('cheese_quiz') }}">Cheese Quiz</a>
      <span>/</span>
      <a href="{{ url_for('pet_page') }}">Pet</a>
      <span>/</span>
      <a href="{{ url_for('history') }}">History</a>
    </nav>
    <div class="user-stats">
      {% if session.get('user') %}
        <div>👤 {{ session.get('user') }}</div>
        <div>🪶 <span class="crumb-count">{{ breadcrumbs if breadcrumbs is defined else 0 }}</span></div>
        <div>🧀 <span class="cheese-count">{{ cheese if cheese is defined else 0 }}</span></div>
        <div>😊 <span class="happiness-count">{{ happiness }}</span></div>
      {% endif %}
    </div>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
  <script>
  // --- Universal UI counter updater ---
  window.updateCounters = function(data) {
    if (!data) return;

    if (data.breadcrumbs !== undefined) {
      document.querySelectorAll('.crumb-count').forEach(el => el.textContent = data.breadcrumbs);
    }
    if (data.cheese !== undefined) {
      document.querySelectorAll('.cheese-count').forEach(el => el.textContent = data.cheese);
    }
    if (data.happiness !== undefined) {
      document.querySelectorAll('.happiness-count').forEach(el => el.textContent = data.happiness);
    }
  };
  </script>
</body>
</html>
