{% extends 'base.html' %}

{% block content %}
<div class="quiz-page">
  <div class="crumbs">🪶 Bread crumbs: <span id="crumb-count">{{ breadcrumbs }}</span></div>

  <div id="container">
    <div id="result-table">
      {% for i in range(1, 11) %}
        <div id="result-{{ i }}">{{ i }}</div>
      {% endfor %}
    </div>

    <div id="quiz-section">
      <img id="quiz-img" src="" alt="">
      <span id="slovak-word"></span>
      <input id="answer" placeholder="Enter the English word">
      <button id="confirm">Confirm</button>
      <div id="feedback"></div>
      <div id="history-link" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<script>
let words = {{ words|tojson }};
let run_id = {{ run_id }};
let index = 0;
const total = words.length;

function loadQuestion(){
  if(index >= total){
    document.getElementById('quiz-img').style.display = 'none';
    document.getElementById('answer').style.display = 'none';
    document.getElementById('confirm').style.display = 'none';
    document.getElementById('slovak-word').style.display = 'none';
    document.getElementById('feedback').textContent = 'Run complete!';
    document.getElementById('history-link').innerHTML =
      '<a href="{{ url_for("history") }}">Check your history</a>';
    return;
  }

  const [id, english, slovak, image] = words[index];
  document.getElementById('quiz-img').src = '/static/images/' + image;
  document.getElementById('slovak-word').textContent = slovak;
  document.getElementById('answer').value = '';
  document.getElementById('feedback').textContent = '';
}

async function submitAnswer(){
  const guess = document.getElementById('answer').value.trim();
  if(!guess) return;

  const resp = await fetch('/check', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ run_id: run_id, index: index, guess: guess })
  });
  const data = await resp.json();

  const resultDiv = document.getElementById('result-' + (index+1));
  resultDiv.textContent = (data.correct ? '✅ ' : '❌ ') + data.correct_answer;

  // Update breadcrumbs & cheese live
  document.getElementById('crumb-count').textContent = data.breadcrumbs;
  const cheeseEl = document.getElementById('cheese-count');
  if(cheeseEl) cheeseEl.textContent = data.cheese;

  index++;
  loadQuestion();
}

document.getElementById('confirm').addEventListener('click', submitAnswer);
document.getElementById('answer').addEventListener('keypress', function(e){
  if(e.key === 'Enter'){
    submitAnswer();
    e.preventDefault();
  }
});

loadQuestion();
</script>
{% endblock %}
